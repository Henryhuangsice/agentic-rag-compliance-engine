name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests use a hash embedder and no reranker/LLM, so nothing is downloaded.
      - run: pytest -q

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, console]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PRELOAD_MODELS=false -t agentic-rag-compliance-engine .
      - run: docker build -f gateway/Dockerfile -t agentic-rag-gateway .
