services:
  api:
    build:
      context: .
      args:
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
        MODEL_SOURCE: ${MODEL_SOURCE:-huggingface}
    image: agentic-rag-compliance-engine:latest
    # Not published: only the gateway is reachable from outside.
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/docs:/app/data/docs   # uploaded documents persist on the host
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8787"
    environment:
      UPSTREAM_URL: http://api:8000
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional local LLM:  docker compose --profile ollama up -d
  # then: docker compose exec ollama ollama pull qwen2.5:7b
  # and set LLM_BASE_URL=http://ollama:11434/v1, LLM_MODEL=qwen2.5:7b, LLM_API_KEY=ollama in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
